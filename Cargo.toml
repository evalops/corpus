[workspace]
resolver = "2"
members = [
    "crates/corpus-agent",
    "crates/corpus-core",
    "crates/corpus-scanner",
    "crates/corpus-server",
    "crates/corpusctl",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/evalops/corpus"

[profile.release]
debug = true
